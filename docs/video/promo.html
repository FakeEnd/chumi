  Chumi promo video source. Every frame is a pure function of time: render(t) sets the scene.
  Rendered to MP4 by scripts/make-video.ts (headless Chrome + ffmpeg).  ?lang=zh for the Chinese version.
  Screenshots and their element boxes (regions.js) come from scripts/demo-shoot.ts: docs/assets/screens/ (English)
  and docs/assets/screens/zh/ (中文). The catch-up, the explanation and the desktop pet are live footage from
  scripts/record-footage.ts (dist/footage/<lang>/): the real window and pet, recorded while the answers streamed in. The coding-agent terminal is drawn here from a real Claude Code run on the
  sample project (condensed from its English answer; translated for the Chinese cut).
-->

  document.write('<script src="' + SHOTS + 'regions.js"><\/script>');
  const FOOT = '../../dist/footage/' + LANG + '/';
  for (const c of ['main-catchup', 'main-explain', 'pet-catchup']) document.write('<script src="' + FOOT + c + '/clip.js"><\/script>');

    // opens, the next scene's screenshot as it closes.
    setShots(u0 < DUR[2] / 2 ? 'foot2' : 'playback', u0 < DUR[2] / 2 ? 'foot2' : 'playback', 0);
    if (u0 < DUR[2] / 2) { v = explainView(1); waits.push(show($('foot2'), frameAt(ME, KEYS_EX.at(-1)[1]))); }
    const ct = remap(KEYS_PET, u0);
    waits.push(show($('petFoot'), frameAt(PC, ct)));
    // The desk's camera comes in on the pet as the answer arrives.
    const S = 361 / 1140, px = 850, py = 120;  // #petFoot: 361 px wide for the 1140-px captured page, at (850, 120)
    // Close enough to read the card as it fills in (page CSS y ≈ 300 is the card under the toolbar).
    // The whole desk first (the call and the pet), then close in on the pet as it starts writing.
    const kz = ease(seg(u0, PET_LEAD - 0.2, PET_LEAD + 1.0));
    const z = lerp(1, 2.0, kz);
    const fx = px + 190 * 361 / 380, fy = py + lerp(180, 300, kz) * 361 / 380;
    const cx = clamp(VW / 2 - fx * z, VW - VW * z, 0), cy = clamp(VH / 2 - fy * z, VH - VH * z, 0);
    $('deskCam').style.transform = `translate(${cx}px, ${cy}px) scale(${z})`;
    const iris = Math.min(ease(seg(u0, 0, 0.55)), 1 - ease(seg(u0, DUR[2] - 0.5, DUR[2])));
    desk = iris > 0 ? 1 : 0;
    $('desk').style.clipPath = `circle(${(iris * 1500).toFixed(1)}px at ${(cx + (px + 180) * z).toFixed(1)}px ${(cy + (py + 150) * z).toFixed(1)}px)`;
    const ptr = pointerAt(PC, ct);
    if (ptr) {
      cur = [cx + (px + ptr.x * S) * z, cy + (py + ptr.y * S) * z, fade(u0, 0.3, 0.6, DUR[2] - 0.8, DUR[2] - 0.4)];
      rip = ptr.since >= 0 && ptr.since < 0.7 ? ptr.since / 0.7 : 0;
    }
  } else if (idx === 3) {     // listen again: the cursor clicks a line's play button, the line lights up, then the player
    const t = oldT(3, arguments[0]);
    setShots('playback', 'playback', 1);
    desk = 0;
    v = FULL;  // the row's ▶ is at the window's left edge and the player in its top bar: no crop shows both whole
    const p = ease(seg(t, 20.5, 21.6));
    const [bx, by] = toVp(v, B.pbRow[0] + 14, B.pbRow[1] + Math.min(18, B.pbRow[3] / 2));
    cur = [lerp(VW * .5, bx, p), lerp(VH * .85, by, p), fade(t, 20.4, 20.7, 22.4, 22.8)];
    rip = seg(t, 21.9, 22.6);
    if (t > 23.5) hl = hlBox(v, B.pbPlayer, fade(t, 23.6, 23.9, 24.5, 24.9));
  } else if (idx === 4) {     // the reviewed handoff: an item with its origin and evidence, then Continue in Claude Code
    const t = oldT(4, arguments[0]), u = t - D;
    setShots('playback', 'handoff', ease(seg(u, 19.6, 20.1)));
    const v1 = mix(FULL, R.hDialog, ease(seg(u, 19.6, 20.2)));
    const v2 = mix(v1, R.hItem, ease(seg(u, 20.4, 21.6)));
    v = mix(v2, R.hCont, ease(seg(u, 23.6, 24.4)));
    if (u > 21.6 && u < 22.7) hl = hlBox(v, B.hOrigin, fade(u, 21.7, 22.0, 22.4, 22.7));
    if (u > 22.7 && u < 23.7) hl = hlBox(v, B.hEvidence, fade(u, 22.75, 23.05, 23.4, 23.7));
    const p = ease(seg(u, 24.2, 25.0));
    const [bx, by] = toVp(v, B.hCont[0] + B.hCont[2] * .82, B.hCont[1] + B.hCont[3] * .7);
    cur = [lerp(VW * .45, bx, p), lerp(VH * .55, by, p), fade(u, 24.1, 24.4, 25.6, 26.0)];
    rip = seg(u, 25.2, 25.9);
  } else if (idx === 5) {     // the agent picks it up in the project folder
    const t = oldT(5, arguments[0]);
    setShots('handoff', 'handoff', 0);
    v = R.hCont;
    term = seg(t - D, 26.2, 26.7);
  } else {                    // next meeting: Project context on, an answer that cites the earlier agent sessions
    const t = oldT(6, arguments[0]), u = t - D;
    setShots('handoff', 'pc', 1);
    term = 1 - seg(u, 33.0, 33.5);
    // The answer column from the Project context switch down, then the answer and its sources.
    const pcAsk = column(B.pcCard, B.pcToggle[1] - 150), pcCard = column(B.pcCard, B.pcCard[1] - 14);
    v = mix(pcAsk, pcCard, ease(seg(u, 35.0, 36.4)));
    if (u > 33.6 && u < 34.9) hl = hlBox(v, B.pcToggle, fade(u, 33.7, 34.0, 34.5, 34.9));
    if (u > 36.4) hl = hlBox(v, B.pcSources, fade(u, 36.6, 36.9, 39.2, 39.6));
  }
  applyView(v);
  $('desk').style.opacity = desk;
  $('term').style.opacity = term;
  if (term > 0) renderTerm(oldT(5, t));
  const H = $('hl');
  if (hl) { H.style.left = hl[0] - 6 + 'px'; H.style.top = hl[1] - 4 + 'px'; H.style.width = hl[2] + 12 + 'px'; H.style.height = hl[3] + 8 + 'px'; H.style.opacity = hl[4]; } else H.style.opacity = 0;
  const C = $('cursor');
  if (cur) { C.style.transform = `translate(${cur[0] - 4}px, ${cur[1] - 2}px) scale(${rip > 0 && rip < .25 ? .88 : 1})`; C.style.opacity = cur[2]; } else C.style.opacity = 0;
  const P = $('ripple');
  if (rip > 0 && rip < 1 && cur) { const s = 1 + rip * 4; P.style.transform = `translate(${cur[0] - 10}px, ${cur[1] - 10}px) scale(${s})`; P.style.opacity = 1 - rip; } else P.style.opacity = 0;

  // the loop: each stage lights up in turn, and project memory feeds the next meeting
  const u = t - U0;
  $('loop').style.opacity = fade(u, 39.8, 40.3, 44.5, 45.0);
  $('loop').querySelector('.loopTitle').style.opacity = seg(u, 40.0, 40.5);
  document.querySelectorAll('#loop .node').forEach((el, i) => {
    const s0 = 40.3 + i * .55;
    el.style.opacity = seg(u, s0, s0 + .35); el.style.transform = `scale(${lerp(.9, 1, outBack(seg(u, s0, s0 + .5)))})`;
    el.classList.toggle('on', u >= 42.6 && Math.floor((u - 42.6) / .45) % 4 === i);
  });
  document.querySelectorAll('#loop .arc').forEach((el, i) => {
    const len = el.getTotalLength(), s0 = 40.55 + i * .55, k = ease(seg(u, s0, s0 + .5));
    el.style.strokeDasharray = `${len}`; el.style.strokeDashoffset = `${len * (1 - k)}`;
    // The arrowhead rides the line's tip, pointing along it, and shows once the line is under way.
    const p = el.getPointAtLength(len * k), q = el.getPointAtLength(Math.max(0, len * k - 2));
    const tip = loopTips[i];
    tip.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${Math.atan2(p.y - q.y, p.x - q.x) * 180 / Math.PI})`);
    tip.style.opacity = seg(k, 0.05, 0.2);
  });
  $('ctx').style.opacity = seg(u, 42.4, 42.8);
  $('hub').style.opacity = seg(u, 40.2, 40.7);

  // trust
  // Each closing scene crossfades with the one before it, so no frame is empty.
  $('trust').style.opacity = fade(u, 44.6, 45.0, 49.2, 49.6);
  $('trust').querySelector('.trustTitle').style.opacity = seg(u, 44.8, 45.2);
  document.querySelectorAll('.tcard').forEach((el, i) => {
    const s0 = 45.0 + i * .25;
    el.style.opacity = seg(u, s0, s0 + .4); el.style.transform = `translateY(${lerp(40, 0, ease(seg(u, s0, s0 + .6)))}px)`;
  });

  // outro
  $('outro').style.opacity = seg(u, 49.3, 49.8) * (1 - seg(u, 52.9, 53.6));
  return Promise.all(waits);
};
render(0);
</script>
</body></html>
