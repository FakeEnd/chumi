<!doctype html>
<!--
  Source for the README banner (Chumi). Regenerate all four variants with:
    bash scripts/make-banner.sh
  Variants: ?theme=light|dark  &  ?lang=en|zh
  The pet (pet-listening.png) is a frame of the real desktop pet, cut from record-footage.ts's transparent pet footage.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0c0f1e; --bg2: #11152a; --panel: #171c31; --panel2: #1c2240; --text: #eceefa; --muted: #9aa3c2; --faint: #6c7596;
    --line: #262d4a; --accent: #8f8bff; --teal: #3cc4dd; --amber: #fbbf24; --rec: #ff6b5f; --ok: #4ade80; --ok-bg: rgba(74,222,128,.12);
    --grid: rgba(143,139,255,.055); --glow: rgba(110,100,255,.22); --glow2: rgba(60,196,221,.10);
    --chip-bg: rgba(143,139,255,.12); --chip-line: rgba(143,139,255,.30);
    --bubble: #232a50; --bubble-line: #343d72; --shadow: 0 26px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
    --btn: #6d63ff; --btn-text: #fff; --select: #11152a;
  }
  html[data-theme="light"] {
    --bg: #edf0fa; --bg2: #f7f8fd; --panel: #ffffff; --panel2: #f6f7fd; --text: #141a33; --muted: #59627f; --faint: #8b93ad;
    --line: #e3e6f2; --accent: #4f46e5; --teal: #0e9fb8; --amber: #f59e0b; --rec: #e0352b; --ok: #15803d; --ok-bg: rgba(21,128,61,.08);
    --grid: rgba(79,70,229,.05); --glow: rgba(79,70,229,.13); --glow2: rgba(14,159,184,.09);
    --chip-bg: rgba(79,70,229,.07); --chip-line: rgba(79,70,229,.20);
    --bubble: #ebeeff; --bubble-line: #d3d8fb; --shadow: 0 22px 50px rgba(20,26,51,.14), 0 2px 6px rgba(20,26,51,.07);
    --btn: #4f46e5; --btn-text: #fff; --select: #f6f7fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { width: 1280px; height: 560px; overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
  .stage { position: relative; width: 1280px; height: 560px; overflow: hidden;
    background: radial-gradient(760px 380px at 88% 4%, var(--glow), transparent 70%),
                radial-gradient(620px 360px at 4% 100%, var(--glow2), transparent 70%),
                linear-gradient(160deg, var(--bg2), var(--bg)); }
  .stage::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px; mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.35) 60%, transparent 100%); }

  /* left: who it is and what it does */
  .left { position: absolute; left: 64px; top: 62px; width: 600px; }
  .eyebrow { display: flex; align-items: center; gap: 16px; }
  .eyebrow svg { width: 50px; height: 50px; filter: drop-shadow(0 8px 16px rgba(79,70,229,.30)); }
  .eyebrow span { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  html[lang="zh"] .eyebrow span { letter-spacing: 1.2px; font-size: 13.5px; }
  .word { font-size: 92px; font-weight: 800; letter-spacing: -3.5px; line-height: 1; margin: 24px 0 18px; }
  .head { font-size: 26px; font-weight: 760; letter-spacing: -.5px; line-height: 1.25; white-space: nowrap; }
  .head .grad { background: linear-gradient(90deg, var(--accent), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  html[lang="zh"] .head { font-size: 29px; letter-spacing: 0; line-height: 1.32; }
  .lead { margin-top: 16px; font-size: 15.5px; line-height: 1.6; color: var(--muted); max-width: 545px; }
  html[lang="zh"] .lead { font-size: 15.5px; line-height: 1.75; }
  .pills { display: flex; gap: 9px; margin-top: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 650;
    color: var(--accent); background: var(--chip-bg); border: 1px solid var(--chip-line); white-space: nowrap; }
  .pill svg { width: 14px; height: 14px; }

  /* right: listen, understand, hand it on */
  .card { position: absolute; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 7px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; } .d1 { background: #ff5f57; } .d2 { background: #febc2e; } .d3 { background: #28c840; }
  .bar .title { margin-left: 10px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
  .bar .rec { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--rec); font-variant-numeric: tabular-nums; }
  .bar .rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 4px rgba(224,53,43,.18); }
  .bar .ok { margin-left: auto; font-size: 11.5px; font-weight: 750; color: var(--ok); background: var(--ok-bg); padding: 3px 9px; border-radius: 999px; }

  .live { right: 52px; top: 64px; width: 470px; }
  .live .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .q { align-self: flex-end; padding: 8px 13px; border-radius: 13px 13px 4px 13px; background: var(--bubble); border: 1px solid var(--bubble-line); font-size: 13.5px; font-weight: 560; }
  .q b { color: var(--accent); }
  .a { padding: 12px 14px; border-radius: 4px 13px 13px 13px; background: var(--panel2); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; }
  .a .now { font-weight: 750; }
  .t { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--chip-bg); color: var(--accent); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 0 1px; }

  .hand { right: 196px; top: 302px; width: 430px; }
  .hand .body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 9px; }
  .item { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; }
  .item .chk { flex: none; width: 17px; height: 17px; border-radius: 5px; background: var(--ok); display: grid; place-items: center; margin-top: 1px; }
  .item .chk svg { width: 11px; height: 11px; }
  .item .what { font-weight: 620; }
  .item .meta { display: block; margin-top: 2px; font-size: 11.5px; color: var(--faint); }
  .item .meta em { font-style: normal; color: var(--ok); font-weight: 650; }
  .foot { display: flex; align-items: center; gap: 9px; margin-top: 3px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .sel { margin-left: auto; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--select); color: var(--text); font-weight: 600; white-space: nowrap; }
  .sel::after { content: ' ▾'; color: var(--faint); }
  .go { padding: 6px 13px; border-radius: 8px; background: var(--btn); color: var(--btn-text); font-weight: 700; white-space: nowrap; box-shadow: 0 6px 16px rgba(79,70,229,.35); }

  .pet { position: absolute; right: 42px; top: 286px; width: 150px; filter: drop-shadow(0 14px 22px rgba(30,20,90,.28)); }
  .arrow { position: absolute; right: 200px; top: 262px; width: 70px; height: 46px; color: var(--accent); opacity: .7; }
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div class="eyebrow">
      <svg viewBox="100 100 824 824" aria-hidden="true">  <defs>
    <linearGradient id="lt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0E9FB8"/>
    </linearGradient>
    <linearGradient id="lw" gradientUnits="userSpaceOnUse" x1="296" y1="0" x2="744" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ls" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#lt)"/>
  <!-- speech bubble: someone is talking -->
  <path fill="#FFFFFF" d="M342 300H682A110 110 0 0 1 792 410V530A110 110 0 0 1 682 640H448L330 742L356 640H342A110 110 0 0 1 232 530V410A110 110 0 0 1 342 300Z"/>
  <!-- sound wave: Chumi is listening -->
  <g fill="url(#lw)">
    <rect x="296" y="435" width="40" height="70" rx="20"/>
    <rect x="364" y="400" width="40" height="140" rx="20"/>
    <rect x="432" y="365" width="40" height="210" rx="20"/>
    <rect x="500" y="345" width="40" height="250" rx="20"/>
    <rect x="568" y="365" width="40" height="210" rx="20"/>
    <rect x="636" y="400" width="40" height="140" rx="20"/>
    <rect x="704" y="435" width="40" height="70" rx="20"/>
  </g>
  <!-- spark: and helps you understand -->
  <path fill="url(#ls)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" d="M790 196Q790 290 884 290Q790 290 790 384Q790 290 696 290Q790 290 790 196Z"/>
  <circle cx="866" cy="212" r="17" fill="#FDE68A"/></svg>
      <span data-t="eyebrow"></span>
    </div>
    <div class="word">Chumi</div>
    <div class="head"><span data-t="h1"></span><br><span class="grad" data-t="h2"></span></div>
    <p class="lead" data-t="lead"></p>
    <div class="pills">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p1"></span></span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p2"></span></span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p3"></span></span>
    </div>
  </div>

  <!-- during the meeting: a cited catch-up -->
  <div class="card live">
    <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="title" data-t="win"></span><span class="rec"><i></i>REC 4:51</span></div>
    <div class="body">
      <div class="q" data-h="q"></div>
      <div class="a" data-h="a"></div>
    </div>
  </div>
  <!-- after it: the reviewed handoff, continued in the coding agent -->
  <div class="card hand">
    <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="title" data-t="hand"></span><span class="ok" data-t="ok"></span></div>
    <div class="body">
      <div class="item"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span><span><span class="what" data-t="i1"></span><span class="meta" data-h="m1"></span></span></div>
      <div class="item"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span><span><span class="what" data-t="i2"></span><span class="meta" data-h="m2"></span></span></div>
      <div class="foot"><span data-t="cin"></span><span class="sel">Codex app</span><span class="go" data-t="go"></span></div>
    </div>
  </div>
  <img class="pet" src="pet-listening.png" alt="">
</div>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme') === 'light' ? 'light' : 'dark';
  const lang = q.get('lang') === 'zh' ? 'zh' : 'en';
  document.documentElement.dataset.theme = theme;
  document.documentElement.lang = lang;
  const T = {
    en: {
      eyebrow: 'Local-first · Your own AI plan · Cited answers',
      h1: 'From meeting to working code.', h2: 'Understand it live. Hand it to your agent.',
      lead: 'A listening companion for lab meetings, advisor 1:1s and lectures. Chumi transcribes English and Mandarin on your Mac, catches you up and explains at your level, with every answer cited. Then it hands what was decided to your coding agent.',
      p1: 'Runs on your Mac', p2: 'ChatGPT or Claude plan', p3: 'Codex · Claude Code',
      win: 'Lab meeting · citation model',
      q: '<b>Catch me up</b> · last 2 min',
      a: '<span class="now">Now:</span> is the DPO gain real, or <b>judge bias</b>? The same model family labeled the pairs and grades the test set <span class="t">3:06</span>. Still <i>preliminary</i>.',
      hand: 'Handoff', ok: 'Confirmed',
      i1: 'Rerun the judge on length-matched answers', m1: '<em>Agreed in the meeting</em> · Maya · <span class="t">2:24</span>',
      i2: 'Re-check the DPO gain with a different judge', m2: '<em>Agreed in the meeting</em> · <span class="t">2:50</span>',
      cin: 'Continue in', go: 'Continue ↗',
    },
    zh: {
      eyebrow: '本地转写 · 用你自己的 AI 订阅 · 每句回答都有出处',
      h1: '从会议，到代码。', h2: '当场听懂，会后交给 agent 接着做。',
      lead: '为组会、导师一对一和课堂打造的听会助手。Chumi 在你的 Mac 上转写中英文，一键帮你跟上，按你的背景解释，每句回答都有出处；会后把定下的事交给你的编程智能体。',
      p1: '在你的 Mac 本地运行', p2: 'ChatGPT / Claude 订阅', p3: 'Codex · Claude Code',
      win: '组会 · 引用模型',
      q: '<b>帮我跟上</b> · 最近 2 分钟',
      a: '<span class="now">现在：</span>DPO 的提升是真的，还是 <b>judge 偏差</b>？给训练数据打标签和给测试集打分的是同一类模型 <span class="t">3:06</span>，目前仍是<i>初步</i>结论。',
      hand: '交接', ok: '已确认',
      i1: '答案截到匹配长度后重跑 judge', m1: '<em>会上已达成一致</em> · Maya · <span class="t">2:24</span>',
      i2: '换一种 judge 复核 DPO 的提升', m2: '<em>会上已达成一致</em> · <span class="t">2:50</span>',
      cin: '继续在', go: '继续 ↗',
    },
  }[lang];
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-h]')) el.innerHTML = T[el.dataset.h];
</script>
</body>
</html>
