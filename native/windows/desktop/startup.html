<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Chumi</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; font:15px 'Segoe UI',sans-serif; background:#f6f7fb; color:#29324a; }
  main { width:min(580px,85vw); text-align:center; }
  h1 { font-size:36px; font-weight:600; letter-spacing:-1px; }
  p { line-height:1.7; white-space:pre-wrap; }
  .muted { color:#68738a; font-size:13px; overflow-wrap:anywhere; }
</style>
<main><h1>Chumi</h1><p id="message"></p><p class="muted" id="log"></p></main>
<script>
  const query = new URLSearchParams(location.search);
  document.getElementById('message').textContent = query.get('message');
  if (!query.get('message')?.startsWith('正在')) document.getElementById('log').textContent = '菜单 → Chumi → 查看日志\n' + query.get('log');
</script>
</html>
