<!doctype html>
<!--
  Source for the README banner (Chumi). Regenerate all four variants with:
    bash scripts/make-banner.sh
  Variants: ?theme=light|dark  &  ?lang=en|zh
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0c0f1e; --bg2: #11152a; --panel: #171c31; --panel2: #1c2240; --text: #eceefa; --muted: #9aa3c2; --faint: #6c7596;
    --line: #262d4a; --accent: #8f8bff; --teal: #3cc4dd; --amber: #fbbf24; --rec: #ff6b5f;
    --grid: rgba(143,139,255,.055); --glow: rgba(110,100,255,.22); --glow2: rgba(60,196,221,.10);
    --chip-bg: rgba(143,139,255,.12); --chip-line: rgba(143,139,255,.30); --ghost: #141930; --ghost-line: #232a46;
    --bubble: #232a50; --bubble-line: #343d72; --shadow: 0 26px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  }
  html[data-theme="light"] {
    --bg: #edf0fa; --bg2: #f7f8fd; --panel: #ffffff; --panel2: #f6f7fd; --text: #141a33; --muted: #59627f; --faint: #8b93ad;
    --line: #e3e6f2; --accent: #4f46e5; --teal: #0e9fb8; --amber: #f59e0b; --rec: #e0352b;
    --grid: rgba(79,70,229,.05); --glow: rgba(79,70,229,.13); --glow2: rgba(14,159,184,.09);
    --chip-bg: rgba(79,70,229,.07); --chip-line: rgba(79,70,229,.20); --ghost: #fdfdff; --ghost-line: #e6e8f4;
    --bubble: #ebeeff; --bubble-line: #d3d8fb; --shadow: 0 22px 50px rgba(20,26,51,.14), 0 2px 6px rgba(20,26,51,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { width: 1280px; height: 560px; overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
  .stage { position: relative; width: 1280px; height: 560px; overflow: hidden;
    background: radial-gradient(760px 380px at 88% 4%, var(--glow), transparent 70%),
                radial-gradient(620px 360px at 4% 100%, var(--glow2), transparent 70%),
                linear-gradient(160deg, var(--bg2), var(--bg)); }
  .stage::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px; mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.35) 60%, transparent 100%); }
  .left { position: absolute; left: 64px; top: 64px; width: 600px; }
  .eyebrow { display: flex; align-items: center; gap: 16px; }
  .eyebrow svg { width: 50px; height: 50px; filter: drop-shadow(0 8px 16px rgba(79,70,229,.30)); }
  .eyebrow span { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  html[lang="zh"] .eyebrow span { letter-spacing: 1.2px; font-size: 13.5px; }
  .word { font-size: 92px; font-weight: 800; letter-spacing: -3.5px; line-height: 1; margin: 26px 0 18px; }
  .head { font-size: 29px; font-weight: 750; letter-spacing: -.4px; line-height: 1.22; }
  .head .grad { background: linear-gradient(90deg, var(--accent), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin-top: 16px; font-size: 16px; line-height: 1.6; color: var(--muted); max-width: 560px; }
  html[lang="zh"] .lead { font-size: 15.5px; line-height: 1.75; }
  .pills { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 650;
    color: var(--accent); background: var(--chip-bg); border: 1px solid var(--chip-line); }
  .pill svg { width: 14px; height: 14px; }
  .right { position: absolute; right: 56px; top: 92px; width: 520px; }
  .ghost { position: absolute; border-radius: 22px; background: var(--ghost); border: 1px solid var(--ghost-line); }
  .ghost.g1 { left: 34px; right: -26px; top: -30px; height: 400px; opacity: .6; }
  .ghost.g2 { left: 17px; right: -13px; top: -15px; height: 410px; opacity: .85; }
  .card { position: relative; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dot { width: 11px; height: 11px; border-radius: 50%; } .d1 { background: #ff5f57; } .d2 { background: #febc2e; } .d3 { background: #28c840; }
  .bar .title { margin-left: 12px; font-weight: 700; font-size: 14.5px; }
  .bar .rec { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--rec); font-variant-numeric: tabular-nums; }
  .bar .rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 4px rgba(224,53,43,.18); }
  .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .q { align-self: flex-end; max-width: 82%; padding: 10px 15px; border-radius: 14px 14px 4px 14px; background: var(--bubble); border: 1px solid var(--bubble-line); font-size: 14.5px; font-weight: 550; }
  .q b { color: var(--accent); }
  .a { padding: 14px 16px; border-radius: 4px 14px 14px 14px; background: var(--panel2); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.6; }
  .a .now { font-weight: 750; }
  .t { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--chip-bg); color: var(--accent); font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 0 1px; }
  .grounded { margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--line); }
  .grounded .lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 1.8px; color: var(--faint); text-transform: uppercase; }
  .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; padding: 5px 9px; border-radius: 8px; background: var(--chip-bg); border: 1px solid var(--chip-line); color: var(--muted); }
  .chip b { color: var(--accent); font-weight: 600; }
  .live { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--faint); font-style: italic; padding: 0 2px; }
  .live .ts { font-style: normal; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div class="eyebrow">
      <svg viewBox="100 100 824 824" aria-hidden="true">  <defs>
    <linearGradient id="lt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0E9FB8"/>
    </linearGradient>
    <linearGradient id="lw" gradientUnits="userSpaceOnUse" x1="296" y1="0" x2="744" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ls" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#lt)"/>
  <!-- speech bubble: someone is talking -->
  <path fill="#FFFFFF" d="M342 300H682A110 110 0 0 1 792 410V530A110 110 0 0 1 682 640H448L330 742L356 640H342A110 110 0 0 1 232 530V410A110 110 0 0 1 342 300Z"/>
  <!-- sound wave: Chumi is listening -->
  <g fill="url(#lw)">
    <rect x="296" y="435" width="40" height="70" rx="20"/>
    <rect x="364" y="400" width="40" height="140" rx="20"/>
    <rect x="432" y="365" width="40" height="210" rx="20"/>
    <rect x="500" y="345" width="40" height="250" rx="20"/>
    <rect x="568" y="365" width="40" height="210" rx="20"/>
    <rect x="636" y="400" width="40" height="140" rx="20"/>
    <rect x="704" y="435" width="40" height="70" rx="20"/>
  </g>
  <!-- spark: and helps you understand -->
  <path fill="url(#ls)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" d="M790 196Q790 290 884 290Q790 290 790 384Q790 290 696 290Q790 290 790 196Z"/>
  <circle cx="866" cy="212" r="17" fill="#FDE68A"/></svg>
      <span data-t="eyebrow"></span>
    </div>
    <div class="word">Chumi</div>
    <div class="head"><span data-t="h1"></span><br><span class="grad" data-t="h2"></span></div>
    <p class="lead" data-t="lead"></p>
    <div class="pills">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p1"></span></span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p2"></span></span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-t="p3"></span></span>
    </div>
  </div>
  <div class="right">
    <div class="ghost g1"></div><div class="ghost g2"></div>
    <div class="card">
      <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="title" data-t="win"></span><span class="rec"><i></i>REC 9:42</span></div>
      <div class="body">
        <div class="q" data-h="q"></div>
        <div class="a">
          <div data-h="a"></div>
          <div class="grounded">
            <div class="lbl" data-t="gl"></div>
            <div class="chips">
              <span class="chip"><b>7:35</b> · Wei</span>
              <span class="chip"><b>8:06</b> · PI</span>
              <span class="chip"><b>9:13</b> · Maya</span>
            </div>
          </div>
        </div>
        <div class="live"><span class="ts">9:42</span><span data-t="live"></span></div>
      </div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme') === 'light' ? 'light' : 'dark';
  const lang = q.get('lang') === 'zh' ? 'zh' : 'en';
  document.documentElement.dataset.theme = theme;
  document.documentElement.lang = lang;
  const T = {
    en: {
      eyebrow: 'Local-first · Your own AI plan · Cited answers',
      h1: 'Never lose the thread.', h2: 'Understand every talk.',
      lead: 'A listening companion for lab meetings, advisor 1:1s, lectures and seminars. Chumi transcribes English and Mandarin on your Mac, catches you up in one click, and explains what you need at your level, with every answer cited to the transcript.',
      p1: 'Runs on your Mac', p2: 'ChatGPT or Claude plan', p3: 'English + Mandarin',
      win: 'Lab meeting · enhancer model', gl: 'Grounded in',
      q: '<b>Catch me up</b> · last 2 min',
      a: '<span class="now">Now:</span> debating whether the GATA-motif signal is real or a <b>batch artifact</b>. The two agreeing replicates were sequenced together <span class="t">8:06</span>; the third disagrees. Still <i>preliminary</i>.',
      live: 'So let’s switch gears to the validation experiment…',
    },
    zh: {
      eyebrow: '本地转写 · 用你自己的 AI 订阅 · 每句回答都有出处',
      h1: '开会不再跟丢。', h2: '每个概念都听得懂。',
      lead: '为实验室组会、导师一对一、课堂和学术报告打造的听会助手。Chumi 在你的 Mac 上实时转写中英文，一键帮你跟上进度，按你的背景解释陌生概念，每个回答都能追溯到原话。',
      p1: '在你的 Mac 本地运行', p2: 'ChatGPT / Claude 订阅', p3: '中英双语',
      win: '组会 · 增强子模型', gl: '出处',
      q: '<b>帮我跟上</b> · 最近 2 分钟',
      a: '<span class="now">现在：</span>在争论 GATA motif 信号是真实的，还是<b>批次效应（batch artifact）</b>。结果一致的两个重复是同一批测序的 <span class="t">8:06</span>，第三个不一致，目前仍是<i>初步</i>结论。',
      live: 'So let’s switch gears to the validation experiment…',
    },
  }[lang];
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-h]')) el.innerHTML = T[el.dataset.h];
</script>
</body>
</html>
