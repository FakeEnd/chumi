<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Chumi</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; font:15px 'Segoe UI',sans-serif; background:#f6f7fb; color:#29324a; }
  main { width:min(580px,85vw); text-align:center; }
  h1 { font-size:36px; font-weight:600; letter-spacing:-1px; }
  p { line-height:1.7; white-space:pre-wrap; }
  button { border:0; border-radius:8px; padding:10px 20px; background:#29324a; color:white; font:inherit; cursor:pointer; }
  .muted { color:#68738a; font-size:13px; overflow-wrap:anywhere; }
</style>
<main><h1>Chumi</h1><p id="message"></p><button id="restart" hidden></button><p class="muted" id="log"></p></main>
<script>
  const query = new URLSearchParams(location.search);
  document.getElementById('message').textContent = query.get('message');
  document.documentElement.lang = query.get('language') === 'zh' ? 'zh-CN' : 'en';
  const restart = document.getElementById('restart');
  restart.textContent = query.get('restartLabel');
  restart.hidden = !restart.textContent;
  restart.addEventListener('click', () => { restart.disabled = true; window.chumiShell.postMessage({ type: 'restart' }); });
  document.getElementById('log').textContent = [query.get('logLabel'), query.get('log')].filter(Boolean).join('\n');
</script>
</html>
