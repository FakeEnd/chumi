<!doctype html>
<!--
  Chumi promo video source. Every frame is a pure function of time: render(t) sets the scene.
  Rendered to MP4 by scripts/make-video.ts (headless Chrome + ffmpeg).  ?lang=zh for Chinese captions.
-->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0e1d; }
  body { font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; color: #eef0fb; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(1100px 600px at 85% -10%, rgba(99,90,255,.28), transparent 65%),
                radial-gradient(900px 600px at -5% 110%, rgba(14,159,184,.20), transparent 65%), linear-gradient(160deg, #11152b, #0a0d1b); }
  #grid { position: absolute; inset: 0; opacity: .5; background-image: linear-gradient(rgba(143,139,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(143,139,255,.05) 1px, transparent 1px); background-size: 40px 40px; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .grad { background: linear-gradient(90deg, #a5a2ff, #4fd1e8); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* intro / outro */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 210px; height: 210px; filter: drop-shadow(0 24px 50px rgba(79,70,229,.45)); }
  .word { font-size: 150px; font-weight: 800; letter-spacing: -6px; margin-top: 22px; line-height: 1; }
  .tag { font-size: 52px; font-weight: 750; letter-spacing: -1px; line-height: 1.25; margin-top: 28px; }
  .small { font-size: 26px; color: #a3aac6; margin-top: 26px; letter-spacing: .3px; }
  .url { margin-top: 34px; font-size: 34px; font-weight: 650; padding: 14px 30px; border-radius: 999px; border: 1.5px solid rgba(143,139,255,.45); background: rgba(143,139,255,.12); color: #c9c7ff; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* problem */
  .lines { position: absolute; left: 180px; top: 300px; }
  .line { font-size: 76px; font-weight: 780; letter-spacing: -2px; line-height: 1.3; opacity: 0; }
  .blurshot { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(22px) saturate(.8); opacity: .18; }

  /* app scenes */
  .window { position: absolute; left: 610px; top: 120px; width: 1240px; height: 828px; border-radius: 22px; overflow: hidden;
    background: #f4f6fb; box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .chrome { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #e9ecf5; border-bottom: 1px solid #d9deea; color: #1b2033; font-size: 15px; font-weight: 650; }
  .chrome.dark { background: #1a1e2e; border-color: #2b3040; color: #e6e8f0; }
  .tl { width: 13px; height: 13px; border-radius: 50%; } .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .chrome .t { margin-left: 12px; }
  .chrome .rec { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #e0352b; font-weight: 750; font-size: 14px; }
  .chrome .rec i { width: 10px; height: 10px; border-radius: 50%; background: #e0352b; }
  .viewport { position: relative; width: 1240px; height: 784px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1360px; height: 860px; transform-origin: 0 0; }
  .hl { position: absolute; z-index: 5; border: 3px solid #f59e0b; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(10,13,27,.0); opacity: 0; }
  .cursor { position: absolute; z-index: 6; left: 0; top: 0; width: 34px; height: 34px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .ripple { position: absolute; z-index: 6; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #4f46e5; opacity: 0; }
  .cap { position: absolute; left: 110px; top: 330px; width: 450px; }
  .kick { font-size: 20px; font-weight: 750; letter-spacing: 3px; text-transform: uppercase; color: #8f8bff; }
  .ctitle { white-space: pre-line; font-size: 54px; font-weight: 800; letter-spacing: -1.6px; line-height: 1.12; margin-top: 16px; }
  .csub { font-size: 25px; line-height: 1.5; color: #b4bad3; margin-top: 22px; }
  html[lang="zh"] .ctitle { letter-spacing: 0; font-size: 52px; } html[lang="zh"] .csub { font-size: 25px; line-height: 1.65; }
  .progress { position: absolute; left: 110px; bottom: 120px; display: flex; gap: 10px; }
  .progress span { width: 34px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); }
  .progress span.on { background: linear-gradient(90deg, #8f8bff, #4fd1e8); }

  /* trust */
  .cards { position: absolute; left: 160px; right: 160px; top: 230px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
  .tcard { border-radius: 26px; padding: 40px 38px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); opacity: 0; }
  .ticon { width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(135deg, #4f46e5, #0e9fb8); }
  .ticon svg { width: 38px; height: 38px; }
  .ttitle { font-size: 36px; font-weight: 780; letter-spacing: -.6px; margin-top: 28px; line-height: 1.2; }
  .tsub { font-size: 23px; color: #a8afc9; margin-top: 14px; line-height: 1.5; }
  .keys { position: absolute; left: 0; right: 0; top: 720px; display: flex; flex-direction: column; align-items: center; gap: 22px; opacity: 0; }
  .keyrow { display: flex; gap: 18px; }
  .key { width: 96px; height: 96px; border-radius: 20px; display: grid; place-items: center; font-size: 46px; font-weight: 600; color: #1b2033;
    background: linear-gradient(#ffffff, #dfe3ef); box-shadow: 0 8px 0 #9aa3bf, 0 14px 26px rgba(0,0,0,.4); }
  .keytext { font-size: 30px; font-weight: 650; color: #d6d9ec; }
  #play { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; z-index: 20;
    background: rgba(14,16,32,.62); border: 3px solid rgba(255,255,255,.9); backdrop-filter: blur(6px); display: none; place-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  #play svg { width: 70px; height: 70px; margin-left: 10px; }
</style></head>

<script>
const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
document.documentElement.lang = lang;
const TXT = {
  en: {
    tag1: 'Never lose the thread.', tag2: 'Understand every talk.',
    p1: 'Lab meetings move fast.', p2: 'Methods from the field next door.', p3: 'Miss one minute, lose the thread.',
    s: [
      ['Listens on your Mac', 'Live transcription', 'English, 中文, or both at once. Speech never leaves your Mac.'],
      ['One click', 'Lost the thread?\nCatch me up.', 'What you missed, how it connects, and what is being argued right now. Every point cited.'],
      ['Explained for you', 'Answers at\nyour level.', 'Select any term. Chumi explains it for your background, in English or 中文.'],
      ['Window capture', 'It sees the\nslides too.', 'Capture the Zoom share or slide deck. Answers check the slide against what was actually said.'],
      ['After the meeting', 'A summary\nyou can trust.', 'Preliminary stays preliminary. Deadlines appear only if someone said them.'],
    ],
    t1: 'Speech stays on your Mac', t1s: 'Local whisper.cpp transcription. No audio upload, ever.',
    t2: 'Uses the plan you have', t2s: 'Your ChatGPT or Claude subscription, with quota shown live.',
    t3: 'No surprise bills', t3s: 'Never switches to a paid API on its own. Pauses instead.',
    keys: 'A talk starts suddenly? Start listening from any app.',
    who: 'Lab meetings · Advisor 1:1s · Lectures · Seminars',
  },
  zh: {
    tag1: '开会不再跟丢。', tag2: '每个概念都听得懂。',
    p1: '组会节奏太快。', p2: '方法来自隔壁领域。', p3: '走神一分钟，就再也跟不上。',
    s: [
      ['在你的 Mac 上收听', '实时转写', '英文、中文、中英混杂都能听懂。音频从不离开你的 Mac。'],
      ['一键', '跟丢了？\n帮我跟上。', '你错过了什么、和前面有什么联系、现在在争论什么。每一点都有出处。'],
      ['为你解释', '按你的水平讲解。', '选中任何术语，Chumi 按你的背景解释，中文或英文都行。'],
      ['窗口截图', '还能看懂幻灯片。', '截取 Zoom 共享屏幕或幻灯片，回答会把幻灯片和讲者原话对照。'],
      ['会后', '值得信赖的总结。', '初步结论不会被写成定论；截止时间只有真说过才会写上。'],
    ],
    t1: '音频留在你的 Mac', t1s: '本地 whisper.cpp 转写，音频从不上传。',
    t2: '用你已有的订阅', t2s: 'ChatGPT 或 Claude 订阅，实时显示额度。',
    t3: '不会突然扣费', t3s: '绝不自动切换到付费 API，额度用完就暂停。',
    keys: '讨论突然开始？在任何应用里一键开始收听。',
    who: '实验室组会 · 导师一对一 · 课堂 · 学术报告',
  },
}[lang];
for (const el of document.querySelectorAll('[data-t]')) el.textContent = TXT[el.dataset.t];

// ---------- helpers
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b, c, d) => Math.min(seg(t, a, b), 1 - seg(t, c, d));
const lerp = (a, b, x) => a + (b - a) * x;
const VW = 1240, VH = 784, IW = 1360, IH = 860, BASE = VW / IW;
const FULL = { z: BASE, x: 0, y: 0 };
function focus(rx, ry, rw, rh, pad = .9) {
  const z = Math.min(VW / rw, VH / rh) * pad;
  let x = VW / 2 - (rx + rw / 2) * z, y = VH / 2 - (ry + rh / 2) * z;
  x = clamp(x, VW - IW * z, 0); y = clamp(y, VH - IH * z, 0);
  return { z, x, y };
}
const mix = (A, B, k) => ({ z: lerp(A.z, B.z, k), x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) });
// regions in screenshot CSS px (1360 × 860)
const R = {
  transcript: focus(20, 350, 867, 493, .98), card: focus(904, 343, 436, 500, .96), catchBtn: [976, 134],
  thumb: focus(20, 360, 420, 110, .9), mismatch: focus(900, 500, 440, 160, .95), summary: focus(904, 377, 436, 466, .96),
};
// All four screenshots are loaded up front and crossfaded (never re-sourced) so no frame shows a half-loaded image.
function setShots(a, b, k) {
  for (const img of document.querySelectorAll('.shot')) {
    const n = img.dataset.shot;
    img.style.zIndex = n === b ? 2 : n === a ? 1 : 0;
    img.style.opacity = n === b ? (a === b ? 1 : k) : n === a ? 1 : 0;
  }
}
function applyView(v) { for (const img of document.querySelectorAll('.shot')) img.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`; return v; }
const toVp = (v, px, py) => [v.x + px * v.z, v.y + py * v.z];

// ---------- timeline (seconds)
const T = { introEnd: 5.2, probEnd: 11.4, appEnd: 47.6, trustEnd: 54.6, end: 62 };
const APP = [ [11.4, 19.0], [19.0, 27.0], [27.0, 34.6], [34.6, 41.0], [41.0, 47.6] ];
window.DURATION = T.end;
window.CLICKS = [21.7];

window.render = function (t) {
  // intro
  const io = fade(t, 0, .4, 4.6, 5.2);
  $('intro').style.opacity = io;
  const lk = outBack(seg(t, .2, 1.3));
  $('introLogo').style.transform = `scale(${lerp(.4, 1, lk)})`;
  $('introLogo').style.opacity = seg(t, .2, .7);
  $('introWord').style.opacity = seg(t, 1.0, 1.7); $('introWord').style.transform = `translateY(${lerp(30, 0, ease(seg(t, 1.0, 1.8)))}px)`;
  $('introTag').style.opacity = seg(t, 2.0, 2.8); $('introTag').style.transform = `translateY(${lerp(24, 0, ease(seg(t, 2.0, 2.9)))}px)`;

  // problem
  $('problem').style.opacity = fade(t, 5.0, 5.5, 10.8, 11.4);
  document.querySelectorAll('#problem .line').forEach((el, i) => {
    const s0 = 5.5 + i * 1.5;
    el.style.opacity = seg(t, s0, s0 + .5); el.style.transform = `translateX(${lerp(-40, 0, ease(seg(t, s0, s0 + .7)))}px)`;
  });

  // app
  const appOn = fade(t, 11.2, 11.9, 47.0, 47.6);
  $('app').style.opacity = appOn;
  $('win').style.transform = `translateY(${lerp(60, 0, ease(seg(t, 11.2, 12.2)))}px) scale(${lerp(.96, 1, ease(seg(t, 11.2, 12.2)))})`;
  let idx = APP.findIndex(([a, b]) => t >= a && t < b); if (idx < 0) idx = t < APP[0][0] ? 0 : 4;
  const [a, b] = APP[idx];
  const capK = fade(t, a + .1, a + .6, b - .45, b - .05);
  const [k1, k2, k3] = TXT.s[idx];
  $('kick').textContent = k1; $('ctitle').textContent = k2; $('csub').textContent = k3;
  document.querySelector('.cap').style.opacity = idx === 0 && t < a + .6 ? Math.min(capK, appOn) : capK;
  document.querySelector('.cap').style.transform = `translateY(${lerp(18, 0, ease(seg(t, a + .1, a + .7)))}px)`;
  document.querySelectorAll('.progress span').forEach((s, i) => s.classList.toggle('on', i <= idx));
  $('chrome').classList.toggle('dark', idx === 4);
  $('rec').style.opacity = idx <= 1 ? .55 + .45 * Math.abs(Math.sin(t * 3)) : 0;

  let v = FULL, hl = null, cur = null, rip = 0;
  if (idx === 0) {            // live transcript: slow push-in on the transcript
    setShots('live', 'live', 0);
    v = mix(FULL, R.transcript, ease(seg(t, 12.6, 18.4)) * .55);
  } else if (idx === 1) {     // cursor clicks Catch me up, then zoom into the card
    setShots('live', 'live', 0);
    const back = ease(seg(t, 19.0, 19.8));
    const v0 = mix(mix(FULL, R.transcript, .55), FULL, back);
    v = mix(v0, R.card, ease(seg(t, 22.3, 24.6)));
    const p = ease(seg(t, 19.9, 21.5));
    const [bx, by] = toVp(v, ...R.catchBtn);
    cur = [lerp(VW * .55, bx, p), lerp(VH * .9, by, p), fade(t, 19.8, 20.1, 22.2, 22.6)];
    rip = seg(t, 21.7, 22.4);
    if (t > 24.4) { const [x1, y1] = toVp(v, 912, 368); const [x2, y2] = toVp(v, 1030, 392); hl = [x1, y1, x2 - x1, y2 - y1, fade(t, 24.6, 25.0, 26.4, 26.8)]; }
  } else if (idx === 2) {     // Chinese explanation
    setShots('live', 'zh', ease(seg(t, 27.0, 27.6)));
    v = mix(mix(R.card, FULL, ease(seg(t, 27.0, 27.6))), R.card, ease(seg(t, 28.0, 30.2)));
  } else if (idx === 3) {     // window capture: thumbnail, then the mismatch sentence
    setShots('zh', 'win', ease(seg(t, 34.6, 35.2)));
    const v1 = mix(R.card, FULL, ease(seg(t, 34.6, 35.2)));
    const v2 = mix(v1, R.thumb, ease(seg(t, 35.4, 36.8)));
    v = mix(v2, R.mismatch, ease(seg(t, 37.4, 39.0)));
    if (t > 38.8) { const [x1, y1] = toVp(v, 912, 512); const [x2, y2] = toVp(v, 1336, 574); hl = [x1, y1, x2 - x1, y2 - y1, fade(t, 39.0, 39.4, 40.5, 40.9)]; }
  } else {                    // summary (dark mode)
    setShots('win', 'sum', ease(seg(t, 41.0, 41.6)));
    v = mix(mix(R.mismatch, FULL, ease(seg(t, 41.0, 41.6))), R.summary, ease(seg(t, 41.9, 44.0)));
    if (t > 44.0) { const [x1, y1] = toVp(v, 914, 520); const [x2, y2] = toVp(v, 1004, 546); hl = [x1, y1, x2 - x1, y2 - y1, fade(t, 44.3, 44.7, 46.4, 46.9)]; }
  }
  applyView(v);
  const H = $('hl');
  if (hl) { H.style.left = hl[0] - 6 + 'px'; H.style.top = hl[1] - 4 + 'px'; H.style.width = hl[2] + 12 + 'px'; H.style.height = hl[3] + 8 + 'px'; H.style.opacity = hl[4]; } else H.style.opacity = 0;
  const C = $('cursor');
  if (cur) { C.style.transform = `translate(${cur[0] - 4}px, ${cur[1] - 2}px) scale(${rip > 0 && rip < .25 ? .88 : 1})`; C.style.opacity = cur[2]; } else C.style.opacity = 0;
  const P = $('ripple');
  if (rip > 0 && rip < 1 && cur) { const s = 1 + rip * 4; P.style.transform = `translate(${cur[0] - 10}px, ${cur[1] - 10}px) scale(${s})`; P.style.opacity = 1 - rip; } else P.style.opacity = 0;

  // trust + shortcut
  $('trust').style.opacity = fade(t, 47.6, 48.1, 54.0, 54.6);
  document.querySelectorAll('.tcard').forEach((el, i) => {
    const s0 = 48.0 + i * .45;
    el.style.opacity = seg(t, s0, s0 + .5); el.style.transform = `translateY(${lerp(40, 0, ease(seg(t, s0, s0 + .7)))}px)`;
  });
  $('keys').style.opacity = seg(t, 50.6, 51.1);
  document.querySelectorAll('.key').forEach((el, i) => {
    const press = fade(t, 51.4 + i * .18, 51.5 + i * .18, 53.0, 53.2);
    el.style.transform = `translateY(${press * 6}px)`; el.style.boxShadow = `0 ${8 - press * 6}px 0 #9aa3bf, 0 ${14 - press * 8}px 26px rgba(0,0,0,.4)`;
  });

  // outro
  $('outro').style.opacity = seg(t, 54.6, 55.3) * (1 - seg(t, 61.2, 62));
};
render(0);
</script>
</body></html>
