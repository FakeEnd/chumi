  Chumi promo video source. Every frame is a pure function of time: render(t) sets the scene.
  Rendered to MP4 by scripts/make-video.ts (headless Chrome + ffmpeg).  ?lang=zh for the Chinese version.
  Screenshots and their element boxes (regions.js) come from scripts/demo-shoot.ts: docs/assets/screens/ (English)
  and docs/assets/screens/zh/ (中文). The coding-agent terminal is drawn here from a real Claude Code run on the
  sample project (the Chinese original; translated for the English cut).
-->

      ['dim', '     chr8+chr9 test、chr10 val 只是会上举例（16:30–16:42），做成参数'],
      ['dim', '  B. 性能图改为多 seed，对比新旧 split'],
      ['dim', '  C. Scaling 曲线和 noise ceiling（5:05–5:14）'],
      ['say', '  需要你先确认：训练代码和数据在哪里？'],
    ],
    loopTitle: '一个闭环，而不是一堆纪要。',
    n1: '会议', n1s: '听懂 · 跟上 · 解释', n2: '审核过的交接', n2s: '有出处 · 由你确认',
    n3: '编程智能体', n3s: 'Claude Code · Codex · opencode · Qwen', n4: '项目记忆', n4s: 'agent 会话，通过 mybot',
    ctx: '项目上下文',
    t1: '音频留在你的 Mac', t1s: '本地 whisper.cpp 转写，音频从不上传。',
    t2: '用你已有的订阅', t2s: 'ChatGPT 或 Claude 订阅，或本地模型。不会突然扣费。',
    t3: 'agent 做什么由你决定', t3s: '只有你确认的工作才会交出去，agent 先给计划。',
    who: '实验室组会 · 导师一对一 · 课堂 · 以及会后的工作',
  },
}[lang];
for (const el of document.querySelectorAll('[data-t]')) el.textContent = TXT[el.dataset.t];

// ---------- helpers
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const fade = (t, a, b, c, d) => Math.min(seg(t, a, b), 1 - seg(t, c, d));
const lerp = (a, b, x) => a + (b - a) * x;
const VW = 1240, VH = 784, IW = 1360, IH = 860, BASE = VW / IW;
const FULL = { z: BASE, x: 0, y: 0 };
function focus(r, pad = .9) {
  const [rx, ry, rw, rh] = r;
  const z = Math.max(BASE, Math.min(VW / rw, VH / rh) * pad);
  let x = VW / 2 - (rx + rw / 2) * z, y = VH / 2 - (ry + rh / 2) * z;
  x = clamp(x, VW - IW * z, 0); y = clamp(y, VH - IH * z, 0);
  return { z, x, y };
}
const mix = (A, B, k) => ({ z: lerp(A.z, B.z, k), x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) });
// Element boxes measured in the screenshots by demo-shoot (fallbacks keep the page usable without them).
const G = window.REGIONS ?? {};
const box = (r, fb) => (Array.isArray(r) && r.length === 4 ? r : fb);
const B = {
  transcript: box(G.live?.transcript, [20, 350, 867, 493]), catchBtn: box(G.live?.catchBtn, [930, 120, 92, 36]),
  card: box(G.live?.card, [904, 343, 436, 500]), covers: box(G.live?.covers, [912, 368, 118, 24]),
  explain: box(G.explain?.card, [904, 343, 436, 500]),
  hDialog: box(G.handoff?.dialog, [200, 60, 960, 740]), hItem: box(G.handoff?.item, [230, 230, 900, 120]), hOrigin: box(G.handoff?.origin, [240, 240, 140, 24]),
  hEvidence: box(G.handoff?.evidence, [240, 320, 200, 24]), hCont: box(G.handoff?.cont, [960, 760, 190, 36]),
  pcToggle: box(G.pc?.toggle, [1150, 300, 130, 26]), pcCard: box(G.pc?.card, [904, 400, 436, 440]), pcSources: box(G.pc?.sources, [912, 430, 200, 24]),
};
const R = {
  transcript: focus(B.transcript, .98), card: focus(B.card, .96), explain: focus(B.explain, .96),
  hDialog: focus(B.hDialog, .98), hItem: focus([B.hItem[0] - 20, B.hItem[1] - 30, B.hItem[2] + 40, B.hItem[3] + 60], .95),
  hCont: focus([B.hCont[0] - 660, B.hCont[1] - 250, 880, 330], 1),
  pcAsk: focus([B.pcToggle[0] - 330, B.pcToggle[1] - 150, 470, 260], 1), pcCard: focus(B.pcCard, .96),
};
const center = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2];
// All screenshots are loaded up front and crossfaded (never re-sourced) so no frame shows a half-loaded image.
function setShots(a, b, k) {
  for (const img of document.querySelectorAll('.shot')) {
    const n = img.dataset.shot;
    img.style.zIndex = n === b ? 2 : n === a ? 1 : 0;
    img.style.opacity = n === b ? (a === b ? 1 : k) : n === a ? 1 : 0;
  }
}
function applyView(v) { for (const img of document.querySelectorAll('.shot')) img.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`; return v; }
const toVp = (v, px, py) => [v.x + px * v.z, v.y + py * v.z];
const hlBox = (v, r, k) => { const [x1, y1] = toVp(v, r[0], r[1]); const [x2, y2] = toVp(v, r[0] + r[2], r[1] + r[3]); return [x1, y1, x2 - x1, y2 - y1, k]; };

// ---------- timeline (seconds): about 54 s
const APP = [[8.0, 14.2], [14.2, 19.6], [19.6, 26.2], [26.2, 33.0], [33.0, 39.8]];
const T = { introEnd: 3.2, probEnd: 8.0, appEnd: 39.8, loopEnd: 45.0, trustEnd: 49.6, end: 53.6 };
window.DURATION = T.end;
window.CLICKS = [11.2, 25.2];
window.APP_WINDOW = [T.probEnd, T.appEnd];
window.POSTER_T = 32.1;
window.PREVIEW_T = [1.6, 6.4, 9.4, 12.6, 16.8, 21.2, 23.0, 25.3, 28.6, 32.1, 34.4, 36.4, 38.4, 41.0, 43.6, 47.4, 51.4];

const termBody = $('termBody');
TXT.term.forEach(([kind, html]) => { const d = document.createElement('div'); d.className = `tl ${kind}`; d.dataset.html = html; termBody.appendChild(d); });
const termLines = [...termBody.children];
/** Shows the first n visible characters of a line's HTML (tags are kept whole). */
function partial(html, n) {
  let out = '', shown = 0;
  for (let i = 0; i < html.length && shown < n; i++) {
    if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j; continue; }
    out += html[i]; shown++;
  }
  return out.replace(/<b>([^<]*)$/, '<b>$1</b>');
}
const plainLen = (html) => html.replace(/<[^>]+>/g, '').length;
function renderTerm(t) {
  // The command types out; tool calls appear one by one; the answer streams in.
  const start = 26.7, slots = [0.0, 0.7, 1.2, 1.6, 1.95, 2.3, 2.65, 3.05, 3.45, 3.7, 3.9, 4.1, 4.3, 4.55];
  termLines.forEach((el, i) => {
    const s0 = start + slots[i], kind = TXT.term[i][0], html = el.dataset.html;
    const typing = kind === 'cmd' ? .6 : kind === 'say' || kind === 'dim' ? .3 : 0;
    const k = typing ? seg(t, s0, s0 + typing) : t >= s0 ? 1 : 0;
    const n = Math.floor(plainLen(html) * k);
    const caret = k > 0 && k < 1 ? '<span class="caret"></span>' : '';
    el.innerHTML = n ? partial(html, n) + caret : '';
    el.style.display = t >= s0 ? 'block' : 'none';
  });
}

window.render = function (t) {
  // intro
  $('intro').style.opacity = fade(t, 0, .3, 2.7, 3.2);
  const lk = outBack(seg(t, .1, .9));
  $('introLogo').style.transform = `scale(${lerp(.4, 1, lk)})`;
  $('introLogo').style.opacity = seg(t, .1, .5);
  $('introWord').style.opacity = seg(t, .6, 1.1); $('introWord').style.transform = `translateY(${lerp(30, 0, ease(seg(t, .6, 1.2)))}px)`;
  $('introTag').style.opacity = seg(t, 1.1, 1.7); $('introTag').style.transform = `translateY(${lerp(24, 0, ease(seg(t, 1.1, 1.8)))}px)`;

  // problem: where meeting apps stop
  $('problem').style.opacity = fade(t, 3.0, 3.4, 7.5, 8.0);
  document.querySelectorAll('#problem .line').forEach((el, i) => {
    const s0 = 3.4 + i * 1.1;
    el.style.opacity = seg(t, s0, s0 + .4); el.style.transform = `translateX(${lerp(-40, 0, ease(seg(t, s0, s0 + .6)))}px)`;
  });

  // app
  const appOn = fade(t, 7.8, 8.4, 39.3, 39.8);
  $('app').style.opacity = appOn;
  $('win').style.transform = `translateY(${lerp(60, 0, ease(seg(t, 7.8, 8.7)))}px) scale(${lerp(.96, 1, ease(seg(t, 7.8, 8.7)))})`;
  let idx = APP.findIndex(([a, b]) => t >= a && t < b); if (idx < 0) idx = t < APP[0][0] ? 0 : APP.length - 1;
  const [a, b] = APP[idx];
  const capK = fade(t, a + .05, a + .5, b - .4, b - .05);
  const [k1, k2, k3] = TXT.s[idx];
  $('kick').textContent = k1; $('ctitle').textContent = k2; $('csub').textContent = k3;
  document.querySelector('.cap').style.opacity = idx === 0 && t < a + .5 ? Math.min(capK, appOn) : capK;
  document.querySelector('.cap').style.transform = `translateY(${lerp(18, 0, ease(seg(t, a + .05, a + .6)))}px)`;
  document.querySelectorAll('.progress span').forEach((s, i) => s.classList.toggle('on', i <= idx));

  let v = FULL, hl = null, cur = null, rip = 0, term = 0;
  if (idx === 0) {            // live transcript, then the cursor clicks Catch me up and the card's covered interval lights up
    setShots('live', 'live', 0);
    const v0 = mix(FULL, R.transcript, ease(seg(t, 8.4, 9.8)) * .45);
    v = mix(mix(v0, FULL, ease(seg(t, 9.8, 10.3))), R.card, ease(seg(t, 11.6, 12.8)));
    const p = ease(seg(t, 10.0, 11.0));
    const [bx, by] = toVp(v, ...center(B.catchBtn));
    cur = [lerp(VW * .55, bx, p), lerp(VH * .9, by, p), fade(t, 9.9, 10.2, 11.5, 11.9)];
    rip = seg(t, 11.2, 11.9);
    if (t > 12.8) hl = hlBox(v, B.covers, fade(t, 12.9, 13.2, 13.8, 14.1));
  } else if (idx === 1) {     // explanation pitched to the profile
    setShots('live', 'explain', ease(seg(t, 14.2, 14.7)));
    v = mix(mix(R.card, FULL, ease(seg(t, 14.2, 14.7))), R.explain, ease(seg(t, 14.9, 16.4)));
  } else if (idx === 2) {     // the reviewed handoff: an item with its origin and evidence, then Continue in Claude Code
    setShots('explain', 'handoff', ease(seg(t, 19.6, 20.1)));
    const v1 = mix(R.explain, R.hDialog, ease(seg(t, 19.6, 20.2)));
    const v2 = mix(v1, R.hItem, ease(seg(t, 20.4, 21.6)));
    v = mix(v2, R.hCont, ease(seg(t, 23.6, 24.4)));
    if (t > 21.6 && t < 22.7) hl = hlBox(v, B.hOrigin, fade(t, 21.7, 22.0, 22.4, 22.7));
    if (t > 22.7 && t < 23.7) hl = hlBox(v, B.hEvidence, fade(t, 22.75, 23.05, 23.4, 23.7));
    const p = ease(seg(t, 24.2, 25.0));
    const [bx, by] = toVp(v, B.hCont[0] + B.hCont[2] * .82, B.hCont[1] + B.hCont[3] * .7);
    cur = [lerp(VW * .45, bx, p), lerp(VH * .55, by, p), fade(t, 24.1, 24.4, 25.6, 26.0)];
    rip = seg(t, 25.2, 25.9);
  } else if (idx === 3) {     // the agent picks it up in the project folder
    setShots('handoff', 'handoff', 0);
    v = R.hCont;
    term = seg(t, 26.2, 26.7);
  } else {                    // next meeting: Project context on, an answer that cites the earlier agent sessions
    setShots('handoff', 'pc', 1);
    term = 1 - seg(t, 33.0, 33.5);
    v = mix(R.pcAsk, R.pcCard, ease(seg(t, 35.0, 36.4)));
    if (t > 33.6 && t < 34.9) hl = hlBox(v, B.pcToggle, fade(t, 33.7, 34.0, 34.5, 34.9));
    if (t > 36.4) hl = hlBox(v, B.pcSources, fade(t, 36.6, 36.9, 39.2, 39.6));
  }
  applyView(v);
  $('term').style.opacity = term;
  if (term > 0) renderTerm(t);
  const H = $('hl');
  if (hl) { H.style.left = hl[0] - 6 + 'px'; H.style.top = hl[1] - 4 + 'px'; H.style.width = hl[2] + 12 + 'px'; H.style.height = hl[3] + 8 + 'px'; H.style.opacity = hl[4]; } else H.style.opacity = 0;
  const C = $('cursor');
  if (cur) { C.style.transform = `translate(${cur[0] - 4}px, ${cur[1] - 2}px) scale(${rip > 0 && rip < .25 ? .88 : 1})`; C.style.opacity = cur[2]; } else C.style.opacity = 0;
  const P = $('ripple');
  if (rip > 0 && rip < 1 && cur) { const s = 1 + rip * 4; P.style.transform = `translate(${cur[0] - 10}px, ${cur[1] - 10}px) scale(${s})`; P.style.opacity = 1 - rip; } else P.style.opacity = 0;

  // the loop: each stage lights up in turn, and project memory feeds the next meeting
  $('loop').style.opacity = fade(t, 39.8, 40.3, 44.5, 45.0);
  $('loop').querySelector('.loopTitle').style.opacity = seg(t, 40.0, 40.5);
  document.querySelectorAll('#loop .node').forEach((el, i) => {
    const s0 = 40.3 + i * .55;
    el.style.opacity = seg(t, s0, s0 + .35); el.style.transform = `scale(${lerp(.9, 1, outBack(seg(t, s0, s0 + .5)))})`;
    el.classList.toggle('on', t >= 42.6 && Math.floor((t - 42.6) / .45) % 4 === i);
  });
  document.querySelectorAll('#loop .arc').forEach((el, i) => {
    const len = el.getTotalLength(), s0 = 40.55 + i * .55;
    el.style.strokeDasharray = `${len}`; el.style.strokeDashoffset = `${len * (1 - ease(seg(t, s0, s0 + .5)))}`;
  });
  $('ctx').style.opacity = seg(t, 42.4, 42.8);
  $('hub').style.opacity = seg(t, 40.2, 40.7);

  // trust
  $('trust').style.opacity = fade(t, 45.0, 45.4, 49.1, 49.6);
  document.querySelectorAll('.tcard').forEach((el, i) => {
    const s0 = 45.3 + i * .3;
    el.style.opacity = seg(t, s0, s0 + .4); el.style.transform = `translateY(${lerp(40, 0, ease(seg(t, s0, s0 + .6)))}px)`;
  });

  // outro
  $('outro').style.opacity = seg(t, 49.6, 50.2) * (1 - seg(t, 52.9, 53.6));
};
render(0);
</script>
